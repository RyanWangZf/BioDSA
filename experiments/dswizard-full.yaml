job_name: dswizard-full
n_attempts: 1
n_concurrent_trials: 1
environment: {type: docker, delete: true}
verifier:
  include_logs: [per_item_results.jsonl, summary.json]
agents:
  - import_path: bioagent_dswizard.harbor_agent:DSWizardHarborAgent
    model_name: qwen/qwen3.8-flash
    kwargs: {provider: openai, endpoint: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, item_timeout_seconds: 300, max_attempts: 2, max_tokens: 2000, reasoning_effort: none}
    env: {OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"}
tasks:
  - path: benchmarks/biodsbench/tasks/biodsbench-python
  - path: benchmarks/biodsbench/tasks/biodsbench-r
