job_name: deepevidence-full
n_attempts: 1
n_concurrent_trials: 1
environment: {type: docker, delete: true}
verifier:
  include_logs: [per_item_results.jsonl, summary.json]
agents:
  - import_path: bioagent_deepevidence.harbor_agent:DeepEvidenceHarborAgent
    model_name: qwen/qwen3.8-flash
    kwargs: {provider: openai, endpoint: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, item_timeout_seconds: 300, tool_mode: live, knowledge_bases: [pubmed_papers, clinical_trials], routes: [bfs, dfs], tool_call_budget: 4, max_attempts: 2, max_tokens: 2000, reasoning_effort: none}
    env: {OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"}
tasks:
  - path: benchmarks/biomedicine-deep-research/tasks/drug-regimen-design
  - path: benchmarks/biomedicine-deep-research/tasks/evidence-gap-discovery
  - path: benchmarks/biomedicine-deep-research/tasks/hle-biomedicine
  - path: benchmarks/biomedicine-deep-research/tasks/hle-medicine
  - path: benchmarks/biomedicine-deep-research/tasks/in-vivo-metabolic-flux-response
  - path: benchmarks/biomedicine-deep-research/tasks/labbench-dbqa
  - path: benchmarks/biomedicine-deep-research/tasks/labbench-litqa2
  - path: benchmarks/biomedicine-deep-research/tasks/moa-pathway-reasoning
  - path: benchmarks/biomedicine-deep-research/tasks/sample-size-estimation
  - path: benchmarks/biomedicine-deep-research/tasks/supergpqa-hard-medicine
  - path: benchmarks/biomedicine-deep-research/tasks/surrogate-endpoint-discovery
  - path: benchmarks/biomedicine-deep-research/tasks/target-identification
  - path: benchmarks/biomedicine-deep-research/tasks/trqa-lit
