job_name: deepevidence-mix
n_attempts: 1
n_concurrent_trials: 2
environment:
  type: docker
  delete: true
agents:
  - import_path: bioagent_deepevidence.harbor_agent:DeepEvidenceHarborAgent
    model_name: qwen/qwen3.8-flash
    kwargs:
      provider: openai
      endpoint: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      knowledge_bases: [pubmed_papers, clinical_trials]
      routes: [bfs, dfs]
      main_search_rounds_budget: 2
      subagent_action_rounds_budget: 2
      tool_call_budget: 4
      tool_mode: live
      code_execution: true
      max_attempts: 2
      max_tokens: 2000
      reasoning_effort: none
    env:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
tasks:
  - path: benchmarks/biomedicine-deep-research/tasks/bdr-hle-biomedicine-ae548d09956606608b26
  - path: benchmarks/biomedicine-deep-research/tasks/bdr-hle-biomedicine-b44b44af50e6d4800482
  - path: benchmarks/biomedicine-deep-research/tasks/bdr-labbench-litqa2-b2128b52d12884c77e2d
  - path: benchmarks/biomedicine-deep-research/tasks/bdr-labbench-litqa2-a7767e447e74c61298c6
