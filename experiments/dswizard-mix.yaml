job_name: dswizard-mix
n_attempts: 1
n_concurrent_trials: 2
environment:
  type: docker
  delete: true
agents:
  - import_path: bioagent_dswizard.harbor_agent:DSWizardHarborAgent
    model_name: qwen/qwen3.8-flash
    kwargs:
      provider: openai
      endpoint: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      timeout_seconds: 90
      max_attempts: 2
      max_tokens: 2000
      reasoning_effort: none
    env:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
tasks:
  - path: benchmarks/biodsbench/tasks/27959731_0
  - path: benchmarks/biodsbench/tasks/27959731_2
  - path: benchmarks/biodsbench/tasks/27959731_3
  - path: benchmarks/biodsbench/tasks/27959731_4
