[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagent-harbor-runtime"
version = "0.1.0"
description = "Process-isolated item runtime for BioAgent Gym Harbor adapters"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
