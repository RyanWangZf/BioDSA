manifest_version: "1.0"
benchmark_id: live_analysis_smoke
version: "0.1.0"
description: Two bounded live code-generation smoke tasks.
protocol_versions: ["1.0"]
task_types: [data.analysis.python.v1]
prepare: {command: [./prepare.py], runtime: {kind: local}}
evaluate: {command: [./evaluate.py], runtime: {kind: local}}
evaluator: {id: live_analysis_smoke.artifacts, version: "0.1.0"}
schemas:
  data.analysis.python.v1: {input: schemas/input.schema.json, output: schemas/output.schema.json}
metrics: {task_completed: {description: Required artifacts and nonempty answer are present.}}
aggregation: {task_completed: {operation: mean, agent_failure: exclude}}
