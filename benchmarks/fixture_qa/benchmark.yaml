manifest_version: "1.0"
benchmark_id: fixture_qa
version: "0.1.0"
description: Two deterministic multiple-choice tasks for harness conformance.
protocol_versions: ["1.0"]
task_types: [qa.multiple_choice.v1]
prepare:
  command: [./prepare.py]
  runtime:
    kind: local
evaluate:
  command: [./evaluate.py]
  runtime:
    kind: local
evaluator:
  id: fixture_qa.exact_match
  version: "0.1.0"
schemas:
  qa.multiple_choice.v1:
    input: schemas/qa-input.schema.json
    output: schemas/qa-output.schema.json
metrics:
  accuracy:
    description: Exact selected-choice accuracy.
aggregation:
  accuracy:
    operation: mean
    agent_failure: exclude
