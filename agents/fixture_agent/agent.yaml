manifest_version: "1.0"
agent_id: fixture_agent
description: Deterministic QA agent used to verify the file protocol.
protocol_versions: ["1.0"]
task_types: [qa.multiple_choice.v1]
local:
  command: [./run.py]
docker:
  build_context: .
  dockerfile: Dockerfile
  image: bioagent-gym/fixture-agent:0.1
  command: [python, /app/run.py]
required_env: []
resources:
  cpus: 1
  memory: 128m
  gpus: 0
  network: false
budget_capabilities: {}
