manifest_version: "1.0"
agent_id: deepevidence
description: Standalone hierarchical biomedical evidence synthesis agent.
protocol_versions: ["1.0"]
task_types: [research.evidence_synthesis.v1]
local: {command: [./.venv/bin/bioagent-deepevidence]}
docker:
  build_context: .
  dockerfile: Dockerfile
  image: bioagent-gym/deepevidence:0.1
  command: [bioagent-deepevidence]
required_env: []
network: {agent: {mode: internet}, sandbox: {mode: internet}}
sandbox:
  docker: {image: bioagent-gym/deepevidence:0.1, command: [python, -m, bioagent_deepevidence.sandbox_worker]}
  required_env: []
  resources: {cpus: 0.5, memory: 256m, gpus: 0}
resources: {cpus: 1, memory: 512m, gpus: 0}
budget_capabilities: {model_calls: reported_only, tool_calls: agent_enforced}
