manifest_version: "1.0"
agent_id: coder
description: Standalone migrated CoderAgent.
protocol_versions: ["1.0"]
task_types: [data.analysis.python.v1]
local: {command: [./.venv/bin/bioagent-coder]}
docker:
  build_context: .
  dockerfile: Dockerfile
  image: bioagent-gym/coder:0.1
  command: [bioagent-coder]
required_env: []
network:
  agent: {mode: internet}
  sandbox: {mode: internet}
sandbox:
  docker:
    image: bioagent-gym/coder:0.1
    command: [python, -m, bioagent_coder.sandbox_worker]
  required_env: []
resources: {cpus: 1, memory: 512m, gpus: 0}
budget_capabilities: {model_calls: reported_only}
