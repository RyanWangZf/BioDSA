[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bioagent-coder"
version = "0.2.0"
description = "Standalone BioAgent Gym CoderAgent"
requires-python = ">=3.10"
[project.scripts]
bioagent-coder = "bioagent_coder.cli:main"
[project.optional-dependencies]
harbor = ["harbor==0.23.0"]
[tool.setuptools.packages.find]
where = ["src"]
