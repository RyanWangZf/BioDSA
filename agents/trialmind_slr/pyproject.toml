[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioagent-trialmind-slr"
version = "0.1.0"
description = "TrialMind-SLR integration for Harbor"
requires-python = ">=3.12"
dependencies = ["bioagent-harbor-runtime==0.1.0"]

[project.optional-dependencies]
harbor = ["harbor==0.23.0"]

[tool.setuptools.packages.find]
where = ["src"]
