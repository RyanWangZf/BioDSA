[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bioagent-dswizard"
version = "0.1.0"
description = "Standalone BioAgent Gym DSWizard"
requires-python = ">=3.10"
[project.scripts]
bioagent-dswizard = "bioagent_dswizard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
